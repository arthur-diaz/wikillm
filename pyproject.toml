[project]
name = "rag"
version = "0.1.0"
description = "LLM Wiki — base de connaissances personnelle maintenue par un LLM local"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
    # Backend GUI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[project.scripts]
wiki = "scripts.wiki:cli"
wiki-serve = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "app"]
